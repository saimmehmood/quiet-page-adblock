<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quiet Page</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/on-32.png" alt="" width="22" height="22" id="logo">
    <span class="brand">Quiet Page</span>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <section class="site">
    <div class="site-text">
      <div class="host" id="host">—</div>
      <div class="state" id="siteState">Loading…</div>
    </div>
    <label class="switch" title="Block ads on this site">
      <input type="checkbox" id="siteToggle">
      <span class="slider"></span>
    </label>
  </section>

  <section class="stats">
    <div class="stat"><b id="pageCount">0</b><span>blocked on this page</span></div>
    <div class="stat"><b id="hiddenCount">0</b><span>elements hidden</span></div>
    <div class="stat" id="totalStat"><b id="totalCount">0</b><span>blocked in total</span></div>
  </section>

  <section class="actions">
    <button id="pick" class="btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
      Block an element
    </button>
    <button id="pauseAll" class="btn">Pause on all sites</button>
  </section>

  <p class="note" id="note" hidden></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
